name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot App
        run: ./gradlew clean bootJar

      - name: Move jar to ./app.jar
        run: |
          rm -f app.jar
          cp build/libs/*.jar app.jar

      - name: List JAR to verify
        run: ls -al app.jar

      - name: Copy app.jar and Dockerfile to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "app.jar,Dockerfile,docker-compose.yml"
          target: "/home/${{ secrets.REMOTE_USERNAME }}/Docker/2026_TRIPLES_TEAM_1_BE"

      #      - name: Restart Docker (build backend image)
      #        uses: appleboy/ssh-action@master
      #        with:
      #          host: ${{ secrets.REMOTE_IP }}
      #          username: ${{ secrets.REMOTE_USERNAME }}
      #          key: ${{ secrets.SSH_PRIVATE_KEY }}
      #          port: ${{ secrets.SSH_PORT }}
      #          script: |
      #            set -e
      #            cd /home/${{ secrets.REMOTE_USERNAME }}/Docker
      #            docker stop springboot || true
      #            docker rm springboot || true
      #            docker rmi beforeonebite-backend:latest || true
      #            docker-compose build --no-cache backend
      #            docker-compose up -d backend

      - name: Blue-Green Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
  
            BASE="/home/${{ secrets.REMOTE_USERNAME }}/Docker/2026_TRIPLES_TEAM_1_BE"
            CONF="/home/${{ secrets.REMOTE_USERNAME }}/Docker/nginx/default.conf"
            
            cd "$BASE"
            
            if [ ! -f "$CONF" ]; then
              echo "❌ nginx config not found"
              exit 1
            fi
            
            if grep -q "springboot-blue:9001" "$CONF"; then
              CURRENT=blue
              NEXT=green
              NEXT_PORT=9002
            else
              CURRENT=green
              NEXT=blue
              NEXT_PORT=9001
            fi
            
            echo "🚀 Switching $CURRENT → $NEXT"
            
            docker compose build --no-cache springboot-$NEXT
            
            docker compose up -d springboot-$NEXT
            
            sleep 5
            
            HEALTH_OK=false
            
            for i in {1..30}; do
            if docker exec springboot-$NEXT \
              sh -c "wget -qO- http://localhost:$NEXT_PORT/actuator/health 2>/dev/null" \
              | grep -q '"status":"UP"'; then
              echo "✅ Health OK"
              HEALTH_OK=true
              break
            fi
            sleep 3
            done
            
            if [ "$HEALTH_OK" != "true" ]; then
              echo "❌ Health check FAILED"
              docker logs springboot-$NEXT
              docker compose stop springboot-$NEXT
              exit 1
            fi
            
            sed -i "s/server springboot-\(blue\|green\):[0-9]\+;/server springboot-$NEXT:$NEXT_PORT;/" "$CONF"
            
            if ! grep -q "springboot-$NEXT:$NEXT_PORT" "$CONF"; then
              echo "❌ nginx upstream 변경 실패"
              docker compose stop springboot-$NEXT
              exit 1
            fi
            
            if ! docker exec nginx nginx -t; then
              echo "❌ nginx config test failed"
              docker compose stop springboot-$NEXT
              exit 1
            fi
            
            # nginx reload
            docker exec nginx nginx -s reload
            
            docker compose stop springboot-$CURRENT
            
            echo "🎉 Deploy Complete"
